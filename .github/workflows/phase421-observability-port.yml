name: Phase 4.2.1 observability port

on:
  pull_request:
    branches:
      - v4.2.1-jito
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - ".github/scripts/port_v421_memory_observability.py"
      - ".github/scripts/fix_v421_port_tests.py"
      - ".github/workflows/phase421-observability-port.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/install-all-deps.sh Linux

      - name: Install pinned stable Rust
        shell: bash
        run: |
          set -euo pipefail
          source ci/rust-version.sh stable
          echo "RUST_STABLE=$rust_stable" >> "$GITHUB_ENV"
          rustup component add rustfmt clippy --toolchain "$rust_stable"

      - name: Apply exact-context semantic port
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/port_v421_memory_observability.py
          python3 .github/scripts/fix_v421_port_tests.py

      - name: Format modified Rust files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +"$RUST_STABLE" --edition 2024 \
            metrics/src/lib.rs \
            metrics/src/pull_metrics.rs \
            accounts-db/src/accounts_scan.rs \
            accounts-db/src/accounts_index/stats.rs \
            rpc/src/rpc_service.rs \
            core/src/validator.rs \
            local-cluster/src/validator_configs.rs \
            validator/src/commands/run/args.rs \
            validator/src/commands/run/execute.rs

      - name: Test pull metrics
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" test -p solana-metrics pull_metrics --lib

      - name: Test scan lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" test -p solana-accounts-db accounts_scan --lib

      - name: Check RPC and validator
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" check -p solana-rpc -p agave-validator

      - name: Clippy modified crates
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" clippy \
            -p solana-metrics \
            -p solana-accounts-db \
            -p solana-rpc \
            -p solana-core \
            -p solana-local-cluster \
            -p agave-validator \
            --lib --bins --tests -- -D warnings

      - name: Commit validated semantic port
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            metrics/src/lib.rs \
            metrics/src/pull_metrics.rs \
            accounts-db/src/accounts_scan.rs \
            accounts-db/src/accounts_index/stats.rs \
            rpc/Cargo.toml \
            rpc/src/rpc_service.rs \
            core/src/validator.rs \
            local-cluster/src/validator_configs.rs \
            validator/src/commands/run/args.rs \
            validator/src/commands/run/execute.rs
          if git diff --cached --quiet; then
            echo "No validated port changes to commit"
            exit 0
          fi
          git commit -m "v4.2.1: port memory observability"
          git push origin HEAD:${{ github.head_ref }}
