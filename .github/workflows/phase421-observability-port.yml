name: Phase 4.2.1 observability port

on:
  pull_request:
    branches:
      - v4.2.1-jito
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - ".github/scripts/port_v421_memory_observability.py"
      - ".github/scripts/fix_v421_port_tests.py"
      - ".github/workflows/phase421-observability-port.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/install-all-deps.sh Linux

      - name: Install pinned stable Rust
        shell: bash
        run: |
          set -euo pipefail
          source ci/rust-version.sh stable
          echo "RUST_STABLE=$rust_stable" >> "$GITHUB_ENV"
          rustup component add rustfmt clippy --toolchain "$rust_stable"

      - name: Verify exact release ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 166de6d3a5082ce1abbe04dd42077fa75cac877e HEAD

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +"$RUST_STABLE" --edition 2024 --check \
            metrics/src/lib.rs \
            metrics/src/pull_metrics.rs \
            accounts-db/src/accounts_scan.rs \
            accounts-db/src/accounts_index/stats.rs \
            rpc/src/rpc_service.rs \
            core/src/validator.rs \
            local-cluster/src/validator_configs.rs \
            validator/src/commands/run/args.rs \
            validator/src/commands/run/execute.rs

      - name: Test pull metrics
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" test -p solana-metrics pull_metrics --lib

      - name: Test scan lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" test -p solana-accounts-db accounts_scan --lib

      - name: Check RPC and validator
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" check -p solana-rpc -p agave-validator

      - name: Clippy modified crates
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" clippy \
            -p solana-metrics \
            -p solana-accounts-db \
            -p solana-rpc \
            -p solana-core \
            -p solana-local-cluster \
            -p agave-validator \
            --lib --bins --tests -- -D warnings

      - name: Production-like release-with-lto validator build
        shell: bash
        run: |
          set -euo pipefail
          export CI_COMMIT="$(git rev-parse HEAD)"
          scripts/cargo-install-all.sh --release-with-lto --validator-only /tmp/agave-v421-observability
          test -x /tmp/agave-v421-observability/bin/agave-validator
          /tmp/agave-v421-observability/bin/agave-validator --version
          sha256sum /tmp/agave-v421-observability/bin/agave-validator
