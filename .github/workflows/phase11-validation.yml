name: Phase 1.1 validation

on:
  push:
    branches:
      - kleomedes/v4.1.2-memory-observability-1.1
  pull_request:
    branches:
      - v4.1.2-jito
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/install-all-deps.sh Linux

      - name: Install pinned stable Rust
        shell: bash
        run: |
          set -euo pipefail
          source ci/rust-version.sh stable
          echo "RUST_STABLE=$rust_stable" >> "$GITHUB_ENV"
          rustup component add rustfmt clippy --toolchain "$rust_stable"

      - name: Check formatting of modified Rust files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +"$RUST_STABLE" --edition 2024 --check \
            metrics/src/pull_metrics.rs \
            accounts-db/src/accounts_scan.rs \
            rpc/src/rpc_service.rs

      - name: Test pull metrics
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" test -p solana-metrics pull_metrics --lib

      - name: Test scan lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" test -p solana-accounts-db accounts_scan --lib

      - name: Check RPC crate
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" check -p solana-rpc

      - name: Clippy modified crates
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_STABLE" clippy \
            -p solana-metrics \
            -p solana-accounts-db \
            -p solana-rpc \
            --all-targets -- -D warnings
